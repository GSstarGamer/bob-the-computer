[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bob-core"
version = "0.1.0"
description = "Bob Stage 2 planner runtime built on the OpenAI API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.30,<3",
  "pydantic>=2.12,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
bob = "bob.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
